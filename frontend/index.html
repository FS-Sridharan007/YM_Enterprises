<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- ✅ important for mobile scaling -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <title>Yazh Marutha</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Logo2.png" />

  <!-- Developer Tools & Inspect Lock -->
  <script>
    // Disable Right Click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Disable Keyboard Shortcuts
    document.onkeydown = function(e) {
      // Disable F12
      if(e.keyCode == 123) {
        return false;
      }
      // Disable Ctrl+Shift+I (Windows) / Cmd+Option+I (Mac)
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
        return false;
      }
      // Disable Ctrl+Shift+J (Windows) / Cmd+Option+J (Mac)
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
        return false;
      }
      // Disable Ctrl+U (View Source) / Cmd+Option+U (Mac)
      if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
        return false;
      }
      // Disable Ctrl+Shift+C (Inspect Element)
      if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) {
        return false;
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
